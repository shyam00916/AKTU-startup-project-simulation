[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "receivables-os-ml"
version = "0.1.0"
description = "Reproducible ML Research Engine for ReceivablesOS: Temporal Customer Embeddings, Behavioral Clustering, Contextual Bandit Collection Optimization, SHAP Explainability, Model Comparison, and Robustness Testing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "xgboost>=3.0",
    "shap>=0.50",
    "torch>=2.5",
    "pydantic>=2.8",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=6.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
